name: ringuringu
services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-game.minseok91.cloud}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
      game: { condition: service_healthy }
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args: { PUBLIC_ORIGIN: "https://${DOMAIN:-game.minseok91.cloud}" }
    restart: unless-stopped
    init: true
    mem_limit: 1g
    environment:
      NODE_OPTIONS: --max-old-space-size=640
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: game
      args: { PUBLIC_ORIGIN: "https://${DOMAIN:-game.minseok91.cloud}" }
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 2g
    environment:
      NODE_OPTIONS: --max-old-space-size=1400
      AUTH_MODE: guest
      GUEST_SIGNING_SECRET: ${GUEST_SIGNING_SECRET:?Run deploy/setup.sh first}
      WEB_ORIGIN: https://${DOMAIN:-game.minseok91.cloud}
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://ringuringu:${GAME_DB_PASSWORD:?Run deploy/setup.sh first}@postgres:5432/ringuringu
      DATABASE_SSL_MODE: disable
      DATABASE_ALLOW_PRIVATE_NETWORK: "true"
      DATABASE_POOL_SIZE: "10"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2567/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s
    logging: *logging

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 1536m
    environment:
      POSTGRES_DB: ringuringu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/setup.sh first}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=50"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ringuringu"]
      interval: 5s
      timeout: 5s
      retries: 15
    logging: *logging

  migrate:
    image: postgres:17-bookworm
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: ringuringu
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run deploy/setup.sh first}
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:?Run deploy/setup.sh first}
    volumes:
      - ../packages/db/migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
      - ./runtime-role.sql:/runtime-role.sql:ro
    entrypoint: ["bash", "/migrate.sh"]
    logging: *logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
