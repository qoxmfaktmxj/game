name: Verify Ringuringu
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:art
      - run: npm run build
      - run: npm run test:built --workspace @moyeotable/game-server
      - run: npx playwright install --with-deps chromium
      - name: Start local app
        run: |
          npm run dev > /tmp/moyeotable-dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:2567/health >/dev/null && curl --fail --silent http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/moyeotable-dev.log
          exit 1
      - run: npm run test:e2e
        env:
          E2E_BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            test-results
            playwright-report
          retention-days: 7
